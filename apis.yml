aid: adm-labs
name: ADM Labs
description: >-
  ADM Labs is a Denver, Colorado hemp processor founded in 2017 by Arman Motiwalla as a
  subsidiary of ADM Group, running an extraction facility on Tejon Street that manufactured
  and wholesaled hemp-derived extracts - biomass, premium smokable, crude, distillate,
  isolate and water-soluble CBD, plus newer exotic cannabinoids - with white-label
  formulation for retail brands. It is a physical-goods manufacturer, not a software
  business, and never ran a developer program: its 2018-2021 site was a WordPress marketing
  site whose only transactional surface was a hosted Zoho Commerce storefront at
  store.adm-labs.com, with no API, SDK, webhook or developer link in its navigation. The
  company has since rebranded as Hemp Corp, which its original LinkedIn page still carries,
  and both adm-labs.com and the successor hempcorpusa.com now serve parking pages.
